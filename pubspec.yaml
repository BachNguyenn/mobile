name: mobile
description: "A Flutter app for Japanese study with JLPT libraries, SRS review, handwriting recognition, analytics, and a Zen garden reward loop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  flutter_riverpod: ^3.3.1
  google_mlkit_digital_ink_recognition: ^0.14.2
  path_provider: ^2.1.5
  equatable: ^2.0.8
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^21.0.0
  flutter_tts: ^4.2.3
  path_drawing: ^1.0.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.14.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo_clean.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo_clean.png"
  adaptive_icon_monochrome: "assets/images/app_logo_clean.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1322"
  image: "assets/images/splash_logo_compact.png"
  image_dark: "assets/images/splash_logo_compact.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F1322"
    image: "assets/images/splash_logo_compact.png"
    image_dark: "assets/images/splash_logo_compact.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/n5/
    - assets/data/n4/
    - assets/data/n3/
    - assets/data/n2/
    - assets/data/n1/
    - assets/data/kanji_sources_manifest.json
    - assets/data/unified_path.json
    - assets/data/app_content.json
    - assets/images/
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Variable.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
